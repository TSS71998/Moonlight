# ld65 linker config for an MMC1 (mapper 1) cartridge
#
#   PRG-ROM: 128 KB = 8 banks of 16 KB
#            banks 0-6 swap in at $8000-$BFFF  (segments BANK0..BANK6)
#            bank 7 is fixed at $C000-$FFFF    (all C code, runtime, vectors)
#   CHR-ROM: 32 KB = 8 banks of 4 KB (MMC1 in 4 KB CHR mode)
#   PRG-RAM: 8 KB at $6000-$7FFF (segment WRAM)
#
# To grow the ROM to 256 KB, add PRG8..PRG14 + STUB8..STUB14 and change the
# PRG size byte in src/crt0.s.

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;   # C parameter stack: $0700-$07FF
}

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    OAM:    start = $0200, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0400, type = rw, file = "", define = yes;
    WRAM:   start = $6000, size = $2000, type = rw, file = "";

    HEADER: start = $0000, size = $0010, file = %O, fill = yes;

    # Each switchable bank ends with a 16-byte reset stub + vectors, so the
    # console boots no matter which bank MMC1 maps at $C000 on power-up.
    PRG0:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB0:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG1:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB1:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG2:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB2:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG3:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB3:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG4:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB4:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG5:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB5:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG6:   start = $8000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB6:  start = $FFF0, size = $0010, file = %O, fill = yes;
    PRG7:   start = $C000, size = $3FF0, file = %O, fill = yes, fillval = $FF;
    STUB7:  start = $FFF0, size = $0010, file = %O, fill = yes;

    CHR:    start = $0000, size = $8000, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    OAM:      load = OAM,  type = bss, align = $100;
    BSS:      load = RAM,  type = bss, define = yes;
    WRAM:     load = WRAM, type = bss, optional = yes;

    HEADER:   load = HEADER, type = ro;

    BANK0:    load = PRG0, type = ro, optional = yes;
    BANK1:    load = PRG1, type = ro, optional = yes;
    BANK2:    load = PRG2, type = ro, optional = yes;
    BANK3:    load = PRG3, type = ro, optional = yes;
    BANK4:    load = PRG4, type = ro, optional = yes;
    BANK5:    load = PRG5, type = ro, optional = yes;
    BANK6:    load = PRG6, type = ro, optional = yes;

    STARTUP:  load = PRG7, type = ro, define = yes;
    LOWCODE:  load = PRG7, type = ro, optional = yes;
    ONCE:     load = PRG7, type = ro, optional = yes;
    CODE:     load = PRG7, type = ro, define = yes;
    RODATA:   load = PRG7, type = ro, define = yes;
    DATA:     load = PRG7, run = RAM, type = rw, define = yes;

    STUB0:    load = STUB0, type = ro;
    STUB1:    load = STUB1, type = ro;
    STUB2:    load = STUB2, type = ro;
    STUB3:    load = STUB3, type = ro;
    STUB4:    load = STUB4, type = ro;
    STUB5:    load = STUB5, type = ro;
    STUB6:    load = STUB6, type = ro;
    STUB7:    load = STUB7, type = ro;

    CHARS:    load = CHR, type = ro;
}

FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}